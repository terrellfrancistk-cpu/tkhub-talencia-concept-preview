<script>
// SPA deep-link fallback for the app demo at /app/ (GitHub Pages serves this for unknown paths).
(function(l){
  var base="/tkhub-talencia-concept-preview";
  var appRoot=base+"/app/";
  if(l.pathname.indexOf(appRoot)===0 && l.pathname.length>appRoot.length){
    var sub="/"+l.pathname.slice(appRoot.length).replace(/\/$/,"");
    var qs=l.search?"&"+l.search.slice(1):"";
    l.replace(appRoot+"?__p="+encodeURIComponent(sub)+qs+l.hash);
  }else{ document.addEventListener("DOMContentLoaded",function(){document.getElementById("m").hidden=false}); }
})(window.location);
</script>
